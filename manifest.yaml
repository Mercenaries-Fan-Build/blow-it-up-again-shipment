  # The DLC's Obama and Palin outfits for every hero and Gramps for Mattias, in the main campaign's
  # wardrobe: always offered, each with the chatter set the DLC gives it (dlc01_pmcinterior.lua:2144-2149),
  # and swapped for the hero's own model during briefings, as the DLC does (bNoBriefing). The DLC's own
  # wardrobe already has all three, so they join the main campaign alone (no levels). Their models, the
  # chatter sets, the DLC's voice banks and the textures vz.wad lacks ship below as level: vz rows, converted
  # from the package like the dlc01 level; the voice stream is the one the add_level installs.
  - kind: add_outfit
    name: pmc_hum_obama
    slug: Obama
    display: "[SHELL.Costumes.obama]"
    wearer: [chris, jen, mattias]
    chatter: Obama_Obama01
    briefing_safe: false
  - kind: add_outfit
    name: pmc_hum_sarah
    slug: Palin
    display: "[SHELL.Costumes.palin]"
    wearer: [chris, jen, mattias]
    chatter: Palin_Palin01
    briefing_safe: false
  - kind: add_outfit
    name: pmc_hum_mattias_v5
    slug: GrandpaMattias
    display: "[SHELL.Costumes.oldmatt]"
    wearer: mattias
    briefing_safe: false
  - kind: add_stringdb_keys
    target: english
    strings: src/strings/english_vz_outfits.txt
  # The DLC's voice banks hold both chatter sets' lines (dlctest01_soundbootstrap.lua:135-136, :186-193).
  - kind: load_sound
