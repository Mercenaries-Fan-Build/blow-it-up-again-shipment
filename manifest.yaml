format: 2

shipment:
  name: blow-it-up-again
  title: Blow It Up Again
  version: 0.4.0
  target: retail
  authors: [Austin Kregel]
  description: The Blow It Up Again DLC as a PC level, built on the player's machine from Sony's PS3 package.
  quartermaster: ">=7.1.0, <8"
  tags: [dlc, level]

load:
  requires:
    # The ASI imports m2-sdk.dll: its Lua host (the namespaces it adds to every state, the chunk executor)
    # and its log. Without the DLL Windows refuses to load the ASI.
    - { shipment: m2-sdk, version: ">=0.6.2" }
    - { shipment: mercs2-unofficial-patch, version: ">=0.6.1" }
    # multiplayer-restored registers the DLC's leaderboard, user-name and cheats bindings
    # (Net.LeaderboardGetScore, Net.LeaderboardPushScore, Net.GetUserName, Pg.SetCheatsUsed, Pg.WereCheatsUsed)
    # and posts the scores to its server as the player's account.
    - { shipment: multiplayer-restored, version: ">=0.6.0" }

contributions:
  # The DLC itself: Sony's PS3 package, downloaded and converted on the player's machine at build. No byte of
  # it ships in this Shipment; every row below with `from: biua_ps3` takes its asset from that conversion.
  - kind: fetch_package
    id: biua_ps3
    format: ps3_dlc_pkg
    url: http://zeus.dl.playstation.net/cdn/UP0006/BLUS30056_00/1ntHdj11R8gYK1qjpRcpRGHI3bEQBhL6i616GVXFV8bh78m4U6iSVyAiYJ4q9RNv6JnuURsk8CN8WWTLSdJU9cT631f4tHSHg7XBs.pkg
    sha256: d62081de1b9efbc484766fb586adba04b03edd5f8571ed03cf6e722bd70263e4
    size: 407578320
  # The ASI (built from client/ by client/scripts/build_asi.sh): the Lua engine functions the DLC's scripts
  # call that PC v1.1 never registered, added to the engine's own tables through m2-sdk.dll's Lua host. It
  # detours, through m2-sdk.dll's MinHook, the game code those functions need: the map's +35/+40 (minimap,
  # GPS line, radar, co-op midpoint, PDA click) and the GUI release that resets them, and the marker creator
  # and update for the DLC disc (client/src/sites.rs).
  - kind: native_hook
    target: retail
    plugin: src/blow_it_up_again.asi
    # The bindings it adds and the alias it sets (client/src/registry.rs). Human.SetChatterSet is how the
    # outfits below apply their chatter sets in the main campaign too (qm's M0264).
    touches:
      - Net.DLCGetMountPoint
      - Human.SetChatterSet
      - Gui.SetMapCorrectionOffset
      - Gui.GetMapCorrectionOffset
      - Gui._MarkerAddDiscDLC
      - Marker.AddDiscDLC
      - Object.GetInfiniteAmmo
  # Blow It Up Again in the shell's Extras > DLC page: the front end's library lists the entry and starts the
  # dlc01 level when it is chosen (src/lua/biua_extras_dlc.lua).
  - kind: add_script
    name: biua_extras_dlc
    source: src/lua/biua_extras_dlc.lua
    load: { when: shell.boot, in: [front_end] }
  # The DLC's vehicles in the main campaign, sold in Eva's PMC shop: the M1A1 and M1A3 tanks, the Hammerhead
  # (DLC Armored Monster), the Recoilless Panhard and The Hadron (DLC_Veyron). Their level-only assets ship in
  # the overlay as level: vz rows, converted from the package like the dlc01 level; their templates are
  # appended to the game's worldentity under the keys the DLC gives them. The M1A1's template is already in
  # vz.wad. The strings file names the shop items and adds the DLC's own names of the Hammerhead, the
  # Recoilless Panhard and The Hadron, whose keys only the DLC's table has.
